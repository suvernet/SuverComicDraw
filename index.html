<body>


<!-- ===== Заставка SuverDraw ===== -->
<div id="splash">
  <div class="splash-card">
    <img class="splash-art" src="cover.jpg" alt="SuverDraw" onerror="this.classList.add('broken')">
    <div class="bar">
        <div class="splash-title">SuverComicDraw</div>
        <div class="splash-sub">Загрузка кистей…</div>
        <div class="splash-bar"><div id="splashFill"></div></div>
    </div>
  </div>
</div>



<div id="controls">

    <button id="theme-toggle-btn" title="Переключить тему (Тёмная/Светлая)"><div class="moon_sun">☽</div></button>
    <div class="file-menu" id="fileMenu">

            <div class="fm-sep">Открыть…</div>
            <button class="open_folder" data-act="open-project"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" height="24px" width="24px" fill="currentColor"><path d="M4,20q-0.82,0-1.41-0.59T2,18V6Q2,5.18 2.59,4.59T4,4h6l2,2h8q0.83,0 1.41,0.59Q22,7.18 22,8H11.18l-2-2H4V18l2.4-8H23.5l-2.57,8.57q-0.2,0.65-0.74,1.04T19,20H4Zm2.1-2H19l1.8-6H7.9L6.1,18Zm0,0l1.8-6L6.1,18ZM4,8V6V8Z"/></svg> Проект SuverComicDraw</button>
            <button data-act="open-image">Открыть файл (PNG/JPEG)</button>

            <div class="fm-sep">Сохранить как…</div>
            <button data-act="save-suver">Сохранить проект (.suver) — свой формат</button>
            <button data-act="save-png">Сохранить в PNG</button>
            <button data-act="save-jpeg">Сохранить в JPG</button>
            <button data-act="save-svg">Сохранить в SVG</button>
            <button data-act="save-suver">Сохранить проект (.suver)</button>
            <button data-act="save-project">Сохранить проект (.json)</button>
        </div>
    </div>
    <input type="file" id="projectFile" accept=".suver,.json" style="display:none">
    <input type="file" id="imageFile" accept="image/*" style="display:none">

    <select id="panel-templates" title="Шаблоны раскадровки комиксов" style="max-width:145px; font-size:12px; padding:3px 6px;">
        <option value="">Шаблоны страниц</option>
        <optgroup label="Классические кадры">
            <option value="grid2x2">Сетка 2×2</option>
            <option value="rows3">3 полосы</option>
            <option value="splash2">Сплэш + 2 кадра</option>
            <option value="grid3x3">Сетка 3×3</option>
            <option value="asym">Асимметрия 1+2+1</option>
        </optgroup>
        <optgroup label="Динамика и Манга (косые)">
            <option value="diagonal_split">Косой разрез (Дуэль)</option>
            <option value="manga_action">Экшен Манга (1 + 2 косых + 1)</option>
            <option value="manga_diagonal3">3 косых полосы (Динамика)</option>
            <option value="shonen_slash">Сёнэн 4 кадра (Крест-накос)</option>
        </optgroup>
    </select>

    <span id="pressVal" class="mini-val">1.0</span>

<script>
// Мини-загрузчик: ползунок идёт по мере готовности скриптов, прячется сам.
(function () {
  var fill = document.getElementById('splashFill');
  var sub = document.querySelector('.splash-sub');
  var scripts = Array.prototype.slice.call(document.querySelectorAll('script[defer][src]'));
  var total = scripts.length || 1, done = 0;
  var born = Date.now();
  var MIN_SHOW = 999500; // заставка висит минимум 2.5 сек — картинку успеешь разглядеть
  function paint(msg) {
    done++;
    if (fill) fill.style.width = Math.round(done / total * 100) + '%';
    if (msg && sub) sub.textContent = msg;
    if (done >= total) {
      var wait = Math.max(0, MIN_SHOW - (Date.now() - born));
      setTimeout(hide, 400 + wait);
    }
  }
  function hide() {
    var s = document.getElementById('splash');
    if (!s) return;
    s.classList.add('hide');
    setTimeout(function () { s.remove(); }, 500);
  }
  scripts.forEach(function (sc) {
    sc.addEventListener('load', function () { paint(); });
    sc.addEventListener('error', function () { paint('Ошибка: ' + sc.getAttribute('src')); });
  });
  // Страховка: если defer-скрипт уже в кэше и load не выстрелил
  setTimeout(function () {
    if (document.getElementById('splash')) {
      var ready = 0;
      scripts.forEach(function (sc) {
        if (sc.getAttribute('data-done')) ready++;
      });
      if (ready === 0) { paint('Готово'); hide(); }
    }
  }, 4000);
  // Фолбэк: скрыть по window.load в любом случае
  window.addEventListener('load', function () { paint('Готово'); });
})();
</script>
